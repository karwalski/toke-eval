name: CI

# 128.27 (1): moved from benchmark/.github/workflows/, where GitHub never ran it.
# Runs `make ci` (lint + tests + check-bench-disjoint), the same entry point as a
# local run. TOKE_OWNER_HIDDEN_TESTS is deliberately never set here: the owner-only
# tests that read hidden tests stay skipped (AGENTS.md section 5).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: make ci
        run: make ci PY=python
